name: Pubblica aggiornamento Vencord Italiano

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da pubblicare (es. 1.0.5)"
        required: true
        default: "1.0.8"
  push:
    tags:
      - "italiano-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build e release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configura pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile

      - name: Compila Vencord Italiano
        env:
          VENCORD_REMOTE: davidev3p0/Vencord-Italiano
        run: pnpm buildStandalone

      - name: Leggi hash build
        id: build
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verifica artefatti
        shell: bash
        run: |
          test -f dist/patcher.js
          test -f dist/preload.js
          test -f dist/renderer.js
          test -f dist/renderer.css

      - name: Determina versione
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="italiano-v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#italiano-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            dist/patcher.js \
            dist/preload.js \
            dist/renderer.js \
            dist/renderer.css \
            --target "${GITHUB_SHA}" \
            --title "Vencord Italiano ${{ steps.build.outputs.hash }}" \
            --notes "Vencord Italiano v${{ steps.release.outputs.version }}. Include traduzione italiana, plugin personalizzati, RealVoiceTTS e aggiornamenti automatici."


  installer:
    name: Installer Windows pubblico
    needs: release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scarica sorgente installer Vencord ufficiale
        shell: pwsh
        run: |
          git clone https://github.com/Vencord/Installer.git installer-upstream
          git -C installer-upstream checkout fe6e041a550b01d1853db6c8ea157d42c7480510

      - name: Configura Go
        uses: actions/setup-go@v6
        with:
          go-version-file: installer-upstream/go.mod
          cache-dependency-path: installer-upstream/go.sum

      - name: Personalizza installer per Vencord Italiano
        shell: pwsh
        run: |
          $repoApi = "https://api.github.com/repos/davidev3p0/Vencord-Italiano/releases/latest"
          $repoDownload = "https://github.com/davidev3p0/Vencord-Italiano/releases/latest/download/"

          $constantsPath = "installer-upstream/constants.go"
          $constants = [IO.File]::ReadAllText($constantsPath)
          $constants = $constants.Replace(
            'const ReleaseUrl = "https://api.github.com/repos/Vendicated/Vencord/releases/latest"',
            ('const ReleaseUrl = "' + $repoApi + '"')
          )
          $constants = $constants.Replace(
            'const ReleaseUrlFallback = "https://vencord.dev/releases/vencord"',
            ('const ReleaseUrlFallback = "' + $repoApi + '"')
          )
          $constants = $constants.Replace(
            'const InstallerReleaseUrl = "https://api.github.com/repos/Vencord/Installer/releases/latest"',
            ('const InstallerReleaseUrl = "' + $repoApi + '"')
          )
          $constants = $constants.Replace(
            'const InstallerReleaseUrlFallback = "https://vencord.dev/releases/installer"',
            ('const InstallerReleaseUrlFallback = "' + $repoApi + '"')
          )
          $constants = $constants.Replace(
            'var UserAgent = "VencordInstaller/" + buildinfo.InstallerGitHash + " (https://github.com/Vencord/Installer)"',
            'var UserAgent = "Vencord-Italiano-Installer/" + buildinfo.InstallerGitHash + " (https://github.com/davidev3p0/Vencord-Italiano)"'
          )
          [IO.File]::WriteAllText($constantsPath, $constants)

          $selfPath = "installer-upstream/self_updater.go"
          $self = [IO.File]::ReadAllText($selfPath)
          $self = $self.Replace(
            'const BaseUrl = "https://github.com/Vencord/Installer/releases/latest/download/"',
            ('const BaseUrl = "' + $repoDownload + '"')
          )
          $self = $self.Replace(
            'filename := Ternary(buildinfo.UiType == buildinfo.UiTypeCli, "VencordInstallerCli.exe", "VencordInstaller.exe")',
            'filename := "Vencord-Italiano-Setup.exe"'
          )
          [IO.File]::WriteAllText($selfPath, $self)

      - name: Compila installer nativo
        shell: pwsh
        working-directory: installer-upstream
        run: |
          $installerHash = (git rev-parse --short HEAD).Trim()
          $installerTag = "${{ needs.release.outputs.tag }}"
          $ldflags = "-s -w -X vencordinstaller/buildinfo.InstallerGitHash=$installerHash -X vencordinstaller/buildinfo.InstallerTag=$installerTag"
          $env:CGO_ENABLED = "0"
          go build -trimpath -tags "static cli" -ldflags $ldflags -o ..\Vencord-Italiano-Setup.exe .

      - name: Genera SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "Vencord-Italiano-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = $hash + "  Vencord-Italiano-Setup.exe" + [Environment]::NewLine
          [IO.File]::WriteAllText("Vencord-Italiano-Setup.exe.sha256", $line)
          Write-Host "SHA256: $hash"

      - name: Attesta provenienza build
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: Vencord-Italiano-Setup.exe

      - name: Pubblica installer nella release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "${{ needs.release.outputs.tag }}" "Vencord-Italiano-Setup.exe" "Vencord-Italiano-Setup.exe.sha256" --clobber
